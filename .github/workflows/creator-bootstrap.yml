name: Creator Bootstrap

# Prime the creator_sync_jobs queue BEFORE the worker runs.
#
# This runs 10 minutes before each worker cycle to ensure jobs are ready.
# Handles large-scale queuing (500+ creators) that would slow down worker startup.
#
# Architecture:
#   1. Bootstrap (this file):  23:50, 05:50, 11:50, 17:50 UTC
#   2. Worker runs:            00:00, 06:00, 12:00, 18:00 UTC
#
# Bootstrap handles:
#   - Shared recovery/refresh admission for all creators, with subscriber-tiered
#     refresh intervals (14d for 10M+, 30d for 10K+, 540d below 10K):
#     never-synced (last_synced_at IS NULL), Pending older than 72 hours,
#     partial syncs older than 24 hours, and tier-due stale creators
#   - Up to 700 new jobs/run, with 1,000 pending/processing jobs total
#   - Incomplete recovery health: fail visibly after 7 days or 3 partial writes
#     after admitting work, so the independently scheduled worker can repair it
#   - Category stats cache refresh (Pass 4)
#   - Hero stats materialized views refresh (Pass 5)
#
# Pass 6 (total_categories recount) is skipped here — it only needs to run
# weekly since category data changes slowly. See creator-bootstrap-weekly.yml.

on:
  schedule:
    # 10 minutes before each worker cycle (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '50 23,5,11,17 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creator-bootstrap-maintenance
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_KEY:          ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_TIMEOUT_S: "30"
      VIDEO_SNAPSHOT_REFRESH_MODE: ${{ vars.VIDEO_SNAPSHOT_REFRESH_MODE || 'off' }}

      # Batch size is defined once so comments and invocations stay in sync.
      # Match the worker's per-cycle processing cap. The shared enqueue RPC
      # excludes pending/processing jobs before selecting candidates, and the
      # active-job unique index closes races without duplicating sync work.
      # Deduplication alone does not bound backlog: the RPC also caps active
      # jobs at 1,000 and serializes admissions with the shared enqueue lock.
      BOOTSTRAP_PRIORITY_BATCH: "700"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-backend.txt

      - name: Queue creators for sync
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "▶ Bootstrap starting at $(date)"
          echo "════════════════════════════════════════════════════════════"

          SNAPSHOT_ARGS=()
          case "$VIDEO_SNAPSHOT_REFRESH_MODE" in
            off) ;;
            preview) SNAPSHOT_ARGS=(--snapshot-refresh-batch 40) ;;
            apply) SNAPSHOT_ARGS=(--snapshot-refresh-batch 40 --snapshot-refresh-apply) ;;
            *) echo "Invalid VIDEO_SNAPSHOT_REFRESH_MODE: use off, preview, or apply"; exit 1 ;;
          esac

          python -m worker.bootstrap_creators \
            "${SNAPSHOT_ARGS[@]}" \
            --priority-batch "${BOOTSTRAP_PRIORITY_BATCH}" \
            --check-recovery-health \
            --no-categories

          echo ""
          echo "════════════════════════════════════════════════════════════"
          echo "✅ Bootstrap finished at $(date)"
          echo "════════════════════════════════════════════════════════════"
